$font = Monospace
$wallpaper = ~/Pictures/papers/pexels-splitshire-1562.jpg

general {
    hide_cursor = false
}

background {
    monitor =
    path = $wallpaper
    blur_passes = 2
    blur_size = 4
}

input-field {
    monitor =
    size = 280, 60
    outline_thickness = 2
    dots_spacing = 0.25
    dots_center = true
    fade_on_empty = false
    placeholder_text = 输入密码解锁
    fail_text = $PAMFAIL
    font_family = $font
    font_color = rgb(ffffff)
    inner_color = rgba(00000066)
    outer_color = rgba(33ccffee) rgba(00ff99ee) 45deg
    check_color = rgba(00ff99ee)
    fail_color = rgba(ff6633ee)
    rounding = 12
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 72
    font_family = $font
    color = rgba(ffffffff)
    position = 0, 90
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%Y-%m-%d %A"
    font_size = 22
    font_family = $font
    color = rgba(ffffffff)
    position = 0, 35
    halign = center
    valign = center
}
