# ===================== 字体设置 =====================
# 等宽代码字体 + 中文 Noto Sans CJK SC
font_family      JetBrainsMono Nerd Font
font_size        13.0
bold_font        auto
italic_font      auto
bold_italic_font auto
# 中文渲染 fallback
font_family      Noto Sans CJK SC
adjust_font_size 0

# 开启字体连字（代码符号美化 >= <= =>）
enable_font_ligatures yes

# ===================== 透明度与窗口 =====================
# 背景透明度 0.80，和你之前Alacritty参数一致，文字不会发灰
background_opacity 0.80
dynamic_background_opacity no

# 内边距，文字距离边框留白，视觉更舒服
window_padding_width 12
# 隐藏标题栏（i3自己管理窗口边框）
hide_window_decorations titlebar-only

# 初始窗口尺寸（可选）
initial_window_width  1020
initial_window_height 640

# ===================== Catppuccin Mocha 配色 =====================
background            #1e1e2e
foreground            #cdd6f4
cursor                #82aaff
cursor_text_color     #1e1e2e
selection_background  #585b70
selection_foreground  #ffffff

# 16 ANSI颜色
color0  #45475a
color1  #f38ba8
color2  #a6e3a1
color3  #f9e2af
color4  #82aaff
color5  #cba6f7
color6  #94e2d5
color7  #cdd6f4

color8  #585b70
color9  #f38ba8
color10 #a6e3a1
color11 #f9e2af
color12 #82aaff
color13 #cba6f7
color14 #94e2d5
color15 #f5e0dc

# ===================== 滚动、性能 =====================
scrollback_lines 10000
sync_to_monitor yes
repaint_delay 8
input_delay 3

# ===================== 鼠标、交互 =====================
mouse_hide_wait 2.0
url_color #82aaff
open_url_modifiers ctrl

# ===================== 内置分屏快捷键（kitty原生分窗） =====================
# 水平分屏（上下排列）
map alt+shift+b launch --location=hsplit
map alt+shift+v launch --location=vsplit
# 关闭当前窗格
map ctrl+shift+w close_window
map ctrl+shift+h neighboring_window left
map ctrl+shift+j neighboring_window down
map ctrl+shift+k neighboring_window up
map ctrl+shift+l neighboring_window right
map ctrl+shift+left neighboring_window left
map ctrl+shift+down neighboring_window down
map ctrl+shift+up neighboring_window up
map ctrl+shift+right neighboring_window right

# ===================== 图像协议（Yazi 图片预览核心） =====================
# 启用kitty图像协议，Yazi不再需要ueberzugpp
allow_remote_control yes
